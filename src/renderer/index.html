<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeedRamp AI</title>
    <meta name="description" content="AI-powered speed ramp video creator from images and music" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', (event) => {
        document.body.innerHTML += '<div style="color:red;position:fixed;top:0;left:0;z-index:9999;background:white;padding:20px;font-family:monospace;pointer-events:none;">' + event.error.stack + '</div>';
      });
      window.addEventListener('unhandledrejection', (event) => {
        document.body.innerHTML += '<div style="color:red;position:fixed;top:0;left:0;z-index:9999;background:white;padding:20px;font-family:monospace;pointer-events:none;">Promise Rejection: ' + event.reason + '</div>';
      });
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
